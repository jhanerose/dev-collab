<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CYBER-PONG – Two Player</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    /* ─────────────────────────────────────────────
       THEME SETTINGS - UPGRADED TO TECH/NEON THEME
    ───────────────────────────────────────────── */
    :root {
      --bg-color:         #050508;   /* Deep space/tech black */
      --court-color:      #0b0f19;   /* Very dark slate for the court */
      --net-color:        #1f2d40;   /* Subtle tech grid line */
      --ball-color:       #00f0ff;   /* High-contrast Neon Cyan */
      --paddle-p1-color:  #ff0055;   /* High-contrast Neon Pink */
      --paddle-p2-color:  #ffe600;   /* High-contrast Neon Yellow */
      --score-color:      #ffffff;   /* Pure white for max readability */
      --ui-font:          'Share Tech Mono', 'Courier New', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg-color);
      /* Tech Grid Background using CSS gradients */
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      background-position: center center;
      
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: var(--ui-font);
      color: var(--score-color);
    }

    h1 { 
      font-size: 2.5rem; 
      letter-spacing: 6px; 
      margin-bottom: 15px; 
      color: var(--score-color);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3), 0 0 20px var(--ball-color);
      text-transform: uppercase;
    }

    /* Upgraded Controls into a "Control Panel" dashboard */
    #controls {
      background: rgba(11, 15, 25, 0.85);
      border: 1px solid var(--net-color);
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 1rem;
      letter-spacing: 1px;
      color: #8a9bb2;
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.8;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
    }

    #controls .p1-key { color: var(--paddle-p1-color); font-weight: bold; }
    #controls .p2-key { color: var(--paddle-p2-color); font-weight: bold; }
    #controls strong { 
      color: var(--ball-color); 
      background: rgba(0, 240, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(0, 240, 255, 0.3);
    }

    canvas {
      display: block;
      background: var(--court-color);
      border: 2px solid var(--net-color);
      border-radius: 8px;
      /* Glowing monitor effect */
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 240, 255, 0.15);
    }

    #message {
      margin-top: 20px;
      font-size: 1.2rem;
      letter-spacing: 2px;
      min-height: 1.2em;
      color: var(--ball-color);
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.7; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <h1>SYS.PONG_</h1>

  <div id="controls">
    PLAYER 1 <span class="p1-key">[W / S]</span> &nbsp;|&nbsp; PLAYER 2 <span class="p2-key">[↑ / ↓]</span>
    <br>
    Press <strong>SPACE</strong> to initialize sequence
  </div>

  <canvas id="gameCanvas"></canvas>
  <div id="message">AWAITING INPUT...</div>

  <script>
    /* ════════════════════════════════════════════
       ░░  PONG  ░░  Two-Player Edition
       ════════════════════════════════════════════
       (Logic remains completely untouched!)
    ════════════════════════════════════════════ */

    const SETTINGS = {
      canvas: {
        width:  800,
        height: 500,
      },
      ball: {
        radius:       8,
        startSpeed:   5,      // initial speed on each serve
        speedIncrease: 0.4,   // how much faster after each paddle hit
        maxSpeed:     14,     // cap so the ball never flies off-screen
      },
      paddle: {
        width:    12,
        height:   90,
        speed:    6,          // pixels per frame when key held
        margin:   18,         // distance from the side wall
      },
      winScore: 7,            // first to this score wins the match
    };

    const canvas  = document.getElementById('gameCanvas');
    const ctx     = canvas.getContext('2d');
    const message = document.getElementById('message');

    canvas.width  = SETTINGS.canvas.width;
    canvas.height = SETTINGS.canvas.height;

    const state = {
      running:   false,  // true while game loop is active
      paused:    false,  // true when SPACE toggles pause mid-game
      gameOver:  false,
      scores:    { p1: 0, p2: 0 },
    };

    const ball = {
      x:  canvas.width  / 2,
      y:  canvas.height / 2,
      vx: SETTINGS.ball.startSpeed,
      vy: SETTINGS.ball.startSpeed,
      r:  SETTINGS.ball.radius,

      reset(serveLeft = true) {
        this.x  = canvas.width  / 2;
        this.y  = canvas.height / 2;
        const angle = (Math.random() * 40 - 20) * (Math.PI / 180); // ±20°
        const speed = SETTINGS.ball.startSpeed;
        this.vx = (serveLeft ? -1 : 1) * speed * Math.cos(angle);
        this.vy = speed * Math.sin(angle);
      },
    };

    const paddleDefaults = {
      w: SETTINGS.paddle.width,
      h: SETTINGS.paddle.height,
      dy: 0,   // current vertical velocity (set by key handlers)
    };

    const p1 = {
      ...paddleDefaults,
      x: SETTINGS.paddle.margin,
      y: canvas.height / 2 - SETTINGS.paddle.height / 2,
    };

    const p2 = {
      ...paddleDefaults,
      x: canvas.width - SETTINGS.paddle.margin - SETTINGS.paddle.width,
      y: canvas.height / 2 - SETTINGS.paddle.height / 2,
    };

    const keys = {};   // e.g. keys['w'] = true while W is held

    document.addEventListener('keydown', e => {
      keys[e.key] = true;

      if (e.key === ' ') {
        e.preventDefault();   // stop page from scrolling

        if (state.gameOver) {
          resetGame();
          return;
        }
        if (!state.running) {
          startGame();
        } else {
          togglePause();
        }
      }
    });

    document.addEventListener('keyup', e => {
      keys[e.key] = false;
    });

    function clamp(val, min, max) {
      return Math.max(min, Math.min(max, val));
    }

    function cssVar(name) {
      return getComputedStyle(document.documentElement)
               .getPropertyValue(name).trim();
    }

    function movePaddles() {
      // Player 1: W (up) / S (down)
      if (keys['w'] || keys['W']) p1.dy = -SETTINGS.paddle.speed;
      else if (keys['s'] || keys['S']) p1.dy =  SETTINGS.paddle.speed;
      else p1.dy = 0;

      // Player 2: ArrowUp / ArrowDown
      if (keys['ArrowUp'])   p2.dy = -SETTINGS.paddle.speed;
      else if (keys['ArrowDown']) p2.dy =  SETTINGS.paddle.speed;
      else p2.dy = 0;

      // Apply movement and keep paddles inside the court
      p1.y = clamp(p1.y + p1.dy, 0, canvas.height - p1.h);
      p2.y = clamp(p2.y + p2.dy, 0, canvas.height - p2.h);
    }

    function moveBall() {
      ball.x += ball.vx;
      ball.y += ball.vy;

      // ── Top / bottom wall bounce
      if (ball.y - ball.r <= 0) {
        ball.y  = ball.r;
        ball.vy = Math.abs(ball.vy);   // force downward
      }
      if (ball.y + ball.r >= canvas.height) {
        ball.y  = canvas.height - ball.r;
        ball.vy = -Math.abs(ball.vy);  // force upward
      }

      // ── Paddle collision (Player 1)
      if (
        ball.x - ball.r <= p1.x + p1.w &&
        ball.x + ball.r >= p1.x         &&
        ball.y          >= p1.y          &&
        ball.y          <= p1.y + p1.h
      ) {
        ball.x  = p1.x + p1.w + ball.r;  // push ball out of paddle
        bounceBallOff(p1, 1);
      }

      // ── Paddle collision (Player 2)
      if (
        ball.x + ball.r >= p2.x         &&
        ball.x - ball.r <= p2.x + p2.w  &&
        ball.y          >= p2.y          &&
        ball.y          <= p2.y + p2.h
      ) {
        ball.x  = p2.x - ball.r;         // push ball out of paddle
        bounceBallOff(p2, -1);
      }

      // ── Score: ball leaves left side → P2 scores
      if (ball.x - ball.r < 0) {
        score('p2');
        return;
      }
      // ── Score: ball leaves right side → P1 scores
      if (ball.x + ball.r > canvas.width) {
        score('p1');
      }
    }

    function bounceBallOff(paddle, dir) {
      const hitPos  = (ball.y - (paddle.y + paddle.h / 2)) / (paddle.h / 2);
      const bounceAngle = hitPos * (Math.PI / 4);  // max 45° deflection

      const currentSpeed = Math.min(
        Math.hypot(ball.vx, ball.vy) + SETTINGS.ball.speedIncrease,
        SETTINGS.ball.maxSpeed
      );

      ball.vx = dir * currentSpeed * Math.cos(bounceAngle);
      ball.vy =       currentSpeed * Math.sin(bounceAngle);
    }

    function score(player) {
      state.scores[player]++;

      if (state.scores[player] >= SETTINGS.winScore) {
        endGame(player);
      } else {
        ball.reset(player === 'p1');   // scored on p2 → serve left; p1 → right
        resetPaddles();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // ── Center net (dashed line)
      ctx.setLineDash([10, 14]);
      ctx.strokeStyle = cssVar('--net-color');
      ctx.lineWidth   = 3;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // ── Scores
      ctx.fillStyle = cssVar('--score-color');
      ctx.font      = 'bold 48px ' + cssVar('--ui-font');
      ctx.textAlign = 'center';
      ctx.fillText(state.scores.p1, canvas.width / 4,       60);
      ctx.fillText(state.scores.p2, canvas.width * 3 / 4,   60);

      // ── Player labels (subtle)
      ctx.font      = '16px ' + cssVar('--ui-font');
      ctx.globalAlpha = 0.3;
      ctx.fillText('P1', canvas.width / 4,     85);
      ctx.fillText('P2', canvas.width * 3 / 4, 85);
      ctx.globalAlpha = 1;

      // ── Paddles
      ctx.fillStyle = cssVar('--paddle-p1-color');
      ctx.beginPath();
      ctx.roundRect(p1.x, p1.y, p1.w, p1.h, 4);
      ctx.fill();

      ctx.fillStyle = cssVar('--paddle-p2-color');
      ctx.beginPath();
      ctx.roundRect(p2.x, p2.y, p2.w, p2.h, 4);
      ctx.fill();

      // ── Ball (circle with a glow effect)
      ctx.shadowColor = cssVar('--ball-color');
      ctx.shadowBlur  = 12;
      ctx.fillStyle   = cssVar('--ball-color');
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur  = 0;   // reset shadow so it doesn't bleed onto text

      // ── Pause overlay
      if (state.paused) {
        ctx.fillStyle   = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = cssVar('--score-color');
        ctx.font      = 'bold 36px ' + cssVar('--ui-font');
        ctx.fillText('SYSTEM PAUSED', canvas.width / 2, canvas.height / 2);
        ctx.font      = '16px ' + cssVar('--ui-font');
        ctx.fillStyle = cssVar('--ball-color');
        ctx.fillText('Press SPACE to resume', canvas.width / 2, canvas.height / 2 + 40);
      }
    }

    let animId = null;

    function loop() {
      if (!state.paused) {
        movePaddles();
        moveBall();
      }
      draw();
      animId = requestAnimationFrame(loop);
    }

    function startGame() {
      state.running  = true;
      state.paused   = false;
      state.gameOver = false;
      message.textContent = '';
      ball.reset(Math.random() < 0.5);  // random first serve
      loop();
    }

    function togglePause() {
      state.paused = !state.paused;
      message.textContent = state.paused ? '' : '';
    }

    function endGame(winner) {
      state.running  = false;
      state.gameOver = true;
      cancelAnimationFrame(animId);

      draw();

      const label = winner === 'p1' ? 'PLAYER 1' : 'PLAYER 2';
      message.textContent = `🏆 ${label} TAKES THE MATCH! Press SPACE to restart.`;
    }

    function resetGame() {
      cancelAnimationFrame(animId);
      state.scores   = { p1: 0, p2: 0 };
      state.gameOver = false;
      state.paused   = false;
      resetPaddles();
      ball.reset(true);
      message.textContent = '';
      startGame();
    }

    function resetPaddles() {
      p1.y = canvas.height / 2 - p1.h / 2;
      p2.y = canvas.height / 2 - p2.h / 2;
      p1.dy = 0;
      p2.dy = 0;
    }

    resetPaddles();
    ball.reset(true);
    draw();
  </script>
</body>
</html>
