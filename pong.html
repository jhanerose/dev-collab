<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CYBER-PONG – Advanced System</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color:         #050508;   
      --court-color:      #0b0f19;   
      --net-color:        #1f2d40;   
      --ball-color:       #00f0ff;   
      --paddle-p1-color:  #ff0055;   
      --paddle-p2-color:  #ffe600;   
      --score-color:      #ffffff;   
      --ui-font:          'Share Tech Mono', 'Courier New', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg-color);
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      background-position: center center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: var(--ui-font);
      color: var(--score-color);
      overflow: hidden; /* Prevents scrollbars during screen shake */
    }

    h1 { 
      font-size: 2.5rem; 
      letter-spacing: 6px; 
      margin-bottom: 15px; 
      color: var(--score-color);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3), 0 0 20px var(--ball-color);
    }

    #controls {
      background: rgba(11, 15, 25, 0.85);
      border: 1px solid var(--net-color);
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 1rem;
      letter-spacing: 1px;
      color: #8a9bb2;
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.8;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
    }

    #controls .p1-key { color: var(--paddle-p1-color); font-weight: bold; }
    #controls .p2-key { color: var(--paddle-p2-color); font-weight: bold; }
    #controls strong { 
      color: var(--ball-color); 
      background: rgba(0, 240, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(0, 240, 255, 0.3);
    }

    canvas {
      display: block;
      background: var(--court-color);
      border: 2px solid var(--net-color);
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.😎, 0 0 15px rgba(0, 240, 255, 0.15);
      /* Smooth transition for when we aren't shaking */
      transition: transform 0.05s ease-out; 
    }

    #message {
      margin-top: 20px;
      font-size: 1.2rem;
      letter-spacing: 2px;
      min-height: 1.2em;
      color: var(--ball-color);
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.7; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <h1>SYS.PONG_v2</h1>

  <div id="controls">
    PLAYER 1 <span class="p1-key">[W / S]</span> &nbsp;|&nbsp; PLAYER 2 <span class="p2-key">[↑ / ↓]</span>
    <br>
    Press <strong>SPACE</strong> to initialize sequence
  </div>

  <canvas id="gameCanvas"></canvas>
  <div id="message">AWAITING INPUT...</div>

  <script>
    /* ─────────────────────────────────────────
       AUDIO SYNTHESIZER (Web Audio API)
    ─────────────────────────────────────────── */
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'hit') {
        // High pitched tech blip
        osc.type = 'square';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
        gainNode.gain.setValueAtTime(0.1, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'score') {
        // Low pitched error/score sound
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
        gainNode.gain.setValueAtTime(0.15, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      }
    }

    /* ─────────────────────────────────────────
       SETTINGS & SETUP
    ─────────────────────────────────────────── */
    const SETTINGS = {
      canvas: { width: 800, height: 500 },
      ball: {
        radius: 8,
        startSpeed: 6,
        speedIncrease: 0.5,
        maxSpeed: 18,
      },
      paddle: {
        width: 12,
        height: 90,
        speed: 8,
        margin: 18,
      },
      winScore: 7,
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const message = document.getElementById('message');

    canvas.width = SETTINGS.canvas.width;
    canvas.height = SETTINGS.canvas.height;

    // Read CSS variables for JS rendering
    function cssVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    const state = {
      running: false,
      paused: false,
      gameOver: false,
      scores: { p1: 0, p2: 0 },
      shakeTime: 0, // Used for screen shake
    };

    /* ─────────────────────────────────────────
       PARTICLE SYSTEM
    ─────────────────────────────────────────── */
    let particles = [];

    function createParticles(x, y, color, direction) {
      for (let i = 0; i < 15; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() * 4 + 2) * direction,
          vy: (Math.random() - 0.5) * 6,
          life: 1.0, // Fades from 1 to 0
          color: color,
          size: Math.random() * 4 + 2
        });
      }
    }

    function updateAndDrawParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03; // Particle decay rate

        if (p.life <= 0) {
          particles.splice(i, 1);
        } else {
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.life;
          ctx.fillRect(p.x, p.y, p.size, p.size);
          ctx.globalAlpha = 1.0;
        }
      }
    }

    /* ─────────────────────────────────────────
       GAME ENTITIES
    ─────────────────────────────────────────── */
    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: SETTINGS.ball.startSpeed,
      vy: SETTINGS.ball.startSpeed,
      r: SETTINGS.ball.radius,
      trail: [], // Stores previous positions for neon blur

      reset(serveLeft = true) {
        this.x = canvas.width / 2;
        this.y = canvas.height / 2;
        this.trail = [];
        const angle = (Math.random() * 40 - 20) * (Math.PI / 180);
        const speed = SETTINGS.ball.startSpeed;
        this.vx = (serveLeft ? -1 : 1) * speed * Math.cos(angle);
        this.vy = speed * Math.sin(angle);
      },
    };

    const p1 = {
      w: SETTINGS.paddle.width, h: SETTINGS.paddle.height, dy: 0,
      x: SETTINGS.paddle.margin,
      y: canvas.height / 2 - SETTINGS.paddle.height / 2,
      color: cssVar('--paddle-p1-color')
    };

    const p2 = {
      w: SETTINGS.paddle.width, h: SETTINGS.paddle.height, dy: 0,
      x: canvas.width - SETTINGS.paddle.margin - SETTINGS.paddle.width,
      y: canvas.height / 2 - SETTINGS.paddle.height / 2,
      color: cssVar('--paddle-p2-color')
    };

    /* ─────────────────────────────────────────
       INPUT & CONTROLS
    ─────────────────────────────────────────── */
    const keys = {};

    document.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === ' ') {
        e.preventDefault();
        
        // Initialize Audio context securely on first user interaction
        if (audioCtx.state === 'suspended') audioCtx.resume();

        if (state.gameOver) {
          resetGame();
        } else if (!state.running) {
          startGame();
        } else {
          togglePause();
        }
      }
    });

    document.addEventListener('keyup', e => { keys[e.key] = false; });

    function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }

    /* ─────────────────────────────────────────
       PHYSICS & LOGIC
    ─────────────────────────────────────────── */
    function movePaddles() {
      if (keys['w'] || keys['W']) p1.dy = -SETTINGS.paddle.speed;
      else if (keys['s'] || keys['S']) p1.dy = SETTINGS.paddle.speed;
      else p1.dy = 0;

      if (keys['ArrowUp']) p2.dy = -SETTINGS.paddle.speed;
      else if (keys['ArrowDown']) p2.dy = SETTINGS.paddle.speed;
      else p2.dy = 0;

      p1.y = clamp(p1.y + p1.dy, 0, canvas.height - p1.h);
      p2.y = clamp(p2.y + p2.dy, 0, canvas.height - p2.h);
    }

    function moveBall() {
      // Store trail history
      ball.trail.push({ x: ball.x, y: ball.y });
      if (ball.trail.length > 😎 ball.trail.shift();

      ball.x += ball.vx;
      ball.y += ball.vy;

      // Wall bounce
      if (ball.y - ball.r <= 0) {
        ball.y = ball.r;
        ball.vy = Math.abs(ball.vy);
        playSound('hit');
      }
      if (ball.y + ball.r >= canvas.height) {
        ball.y = canvas.height - ball.r;
        ball.vy = -Math.abs(ball.vy);
        playSound('hit');
      }

      // Player 1 Collision
      if (ball.x - ball.r <= p1.x + p1.w && ball.x + ball.r >= p1.x && ball.y >= p1.y && ball.y <= p1.y + p1.h) {
        ball.x = p1.x + p1.w + ball.r;
        bounceBallOff(p1, 1);
      }

      // Player 2 Collision
      if (ball.x + ball.r >= p2.x && ball.x - ball.r <= p2.x + p2.w && ball.y >= p2.y && ball.y <= p2.y + p2.h) {
        ball.x = p2.x - ball.r;
        bounceBallOff(p2, -1);
      }

      // Scoring
      if (ball.x - ball.r < 0) score('p2');
      if (ball.x + ball.r > canvas.width) score('p1');
    }

    function bounceBallOff(paddle, dir) {
      playSound('hit');
      createParticles(ball.x, ball.y, paddle.color, dir);
      
      const hitPos = (ball.y - (paddle.y + paddle.h / 2)) / (paddle.h / 2);
      
      // Dynamic angle calculation + paddle movement slice
      const sliceEffect = (paddle.dy / SETTINGS.paddle.speed) * 0.2; 
      const bounceAngle = (hitPos * (Math.PI / 4)) + sliceEffect;

      const currentSpeed = Math.min(
        Math.hypot(ball.vx, ball.vy) + SETTINGS.ball.speedIncrease,
        SETTINGS.ball.maxSpeed
      );

      ball.vx = dir * currentSpeed * Math.cos(bounceAngle);
      ball.vy = currentSpeed * Math.sin(bounceAngle);
    }

    function score(player) {
      playSound('score');
      state.scores[player]++;
      state.shakeTime = 15; // Trigger screen shake
      
      // Explosion particles in center of screen
      createParticles(canvas.width/2, canvas.height/2, cssVar('--ball-color'), Math.random() > 0.5 ? 1 : -1);

      if (state.scores[player] >= SETTINGS.winScore) {
        endGame(player);
      } else {
        ball.reset(player === 'p1');
        resetPaddles();
      }
    }

    /* ─────────────────────────────────────────
       RENDERING
    ─────────────────────────────────────────── */
    function applyScreenShake() {
      if (state.shakeTime > 0) {
        const magnitude = (state.shakeTime / 15) * 8; // intensity decreases
        const dx = (Math.random() - 0.5) * magnitude;
        const dy = (Math.random() - 0.5) * magnitude;
        canvas.style.transform = translate(${dx}px, ${dy}px);
        state.shakeTime--;
      } else {
        canvas.style.transform = translate(0, 0);
      }
    }

    function draw() {
      applyScreenShake();

      // Clear canvas with slight transparency for a fading effect
      ctx.fillStyle = cssVar('--court-color');
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Net
      ctx.setLineDash([10, 14]);
      ctx.strokeStyle = cssVar('--net-color');
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw Scores
      ctx.fillStyle = cssVar('--score-color');
      ctx.font = 'bold 64px ' + cssVar('--ui-font');
      ctx.textAlign = 'center';
      ctx.fillText(state.scores.p1, canvas.width / 4, 80);
      ctx.fillText(state.scores.p2, canvas.width * 3 / 4, 80);

      // Draw Particles
      updateAndDrawParticles();

      // Draw Paddles
      ctx.shadowBlur = 10;
      
      ctx.shadowColor = p1.color;
      ctx.fillStyle = p1.color;
      ctx.fillRect(p1.x, p1.y, p1.w, p1.h);

      ctx.shadowColor = p2.color;
      ctx.fillStyle = p2.color;
      ctx.fillRect(p2.x, p2.y, p2.w, p2.h);

      // Draw Ball Trail
      ctx.shadowBlur = 0; // reset shadow for trail
      for (let i = 0; i < ball.trail.length; i++) {
        const pos = ball.trail[i];
        const alpha = (i / ball.trail.length) * 0.5; // fades out
        ctx.fillStyle = rgba(0, 240, 255, ${alpha});
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, ball.r * (i / ball.trail.length), 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw Ball
      ctx.shadowColor = cssVar('--ball-color');
      ctx.shadowBlur = 15;
      ctx.fillStyle = cssVar('--ball-color');
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Pause Overlay
      if (state.paused) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = cssVar('--score-color');
        ctx.font = 'bold 36px ' + cssVar('--ui-font');
        ctx.fillText('SYSTEM PAUSED', canvas.width / 2, canvas.height / 2);
      }
    }

    /* ─────────────────────────────────────────
       GAME LOOP & STATES
    ─────────────────────────────────────────── */
    let animId = null;

    function loop() {
      if (!state.paused) {
        movePaddles();
        moveBall();
      }
      draw();
      animId = requestAnimationFrame(loop);
    }

    function startGame() {
      state.running = true;
      state.paused = false;
      state.gameOver = false;
      message.textContent = 'SYSTEM ACTIVE';
      message.style.animation = 'none'; // Stop flashing
      ball.reset(Math.random() < 0.5);
      loop();
    }

    function togglePause() {
      state.paused = !state.paused;
      message.textContent = state.paused ? 'AWAITING INPUT...' : 'SYSTEM ACTIVE';
    }

    function endGame(winner) {
      state.running = false;
      state.gameOver = true;
      cancelAnimationFrame(animId);
      draw();
      const label = winner === 'p1' ? 'PLAYER 1' : 'PLAYER 2';
      message.style.animation = 'pulse 1.5s infinite alternate';
      message.textContent = 🏆 ${label} TAKES THE MATCH! Press SPACE to restart.;
    }

    function resetGame() {
      cancelAnimationFrame(animId);
      state.scores = { p1: 0, p2: 0 };
      state.gameOver = false;
      state.paused = false;
      particles = [];
      resetPaddles();
      ball.reset(true);
      startGame();
    }

    function resetPaddles() {
      p1.y = canvas.height / 2 - p1.h / 2;
      p2.y = canvas.height / 2 - p2.h / 2;
      p1.dy = 0;
      p2.dy = 0;
    }

    // Initial render
    resetPaddles();
    ball.reset(true);
    draw();
  </script>
</body>
</html>
