<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CYBER-PONG – Two Player (To 25)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color:         #050508;   
      --court-color:      #0b0f19;   
      --net-color:        #1f2d40;   
      --ball-color:       #00f0ff;   
      --paddle-p1-color:  #ff0055;   
      --paddle-p2-color:  #ffe600;   
      --score-color:      #ffffff;   
      --ui-font:          'Share Tech Mono', 'Courier New', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg-color);
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      background-position: center center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: var(--ui-font);
      color: var(--score-color);
      overflow: hidden;
    }

    h1 { 
      font-size: 2.5rem; 
      letter-spacing: 6px; 
      margin-bottom: 15px; 
      color: var(--score-color);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3), 0 0 20px var(--ball-color);
      text-transform: uppercase;
    }

    #controls {
      background: rgba(11, 15, 25, 0.85);
      border: 1px solid var(--net-color);
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 1rem;
      letter-spacing: 1px;
      color: #8a9bb2;
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.8;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
    }

    #controls .p1-key { color: var(--paddle-p1-color); font-weight: bold; }
    #controls .p2-key { color: var(--paddle-p2-color); font-weight: bold; }
    #controls strong { 
      color: var(--ball-color); 
      background: rgba(0, 240, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(0, 240, 255, 0.3);
    }

    canvas {
      display: block;
      background: var(--court-color);
      border: 2px solid var(--net-color);
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 240, 255, 0.15);
    }

    #message {
      margin-top: 20px;
      font-size: 1.2rem;
      letter-spacing: 2px;
      min-height: 1.2em;
      color: var(--ball-color);
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.7; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <h1>SYS.PONG_</h1>

  <div id="controls">
    PLAYER 1 <span class="p1-key">[W / S]</span> &nbsp;|&nbsp; PLAYER 2 <span class="p2-key">[↑ / ↓]</span>
    <br>
    Press <strong>SPACE</strong> to initialize sequence
  </div>

  <canvas id="gameCanvas"></canvas>
  <div id="message">AWAITING INPUT...</div>

  <script>
    const SETTINGS = {
      canvas: { width: 800, height: 500 },
      ball: {
        radius: 8,
        startSpeed: 6,
        speedIncrease: 0.5,
        maxSpeed: 16,
      },
      paddle: {
        width: 14,
        height: 90,
        speed: 7,
        margin: 18,
      },
      winScore: 25, // <--- CHANGED TO 25
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const message = document.getElementById('message');

    canvas.width = SETTINGS.canvas.width;
    canvas.height = SETTINGS.canvas.height;

    // Game State
    const state = {
      running: false,
      paused: false,
      gameOver: false,
      scores: { p1: 0, p2: 0 },
      rally: 0,
      screenShake: 0
    };

    // Visual Arrays
    let particles = [];
    let ballTrail = [];

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: 0,
      vy: 0,
      r: SETTINGS.ball.radius,

      reset(serveLeft = true) {
        this.x = canvas.width / 2;
        this.y = canvas.height / 2;
        const angle = (Math.random() * 40 - 20) * (Math.PI / 180);
        const speed = SETTINGS.ball.startSpeed;
        this.vx = (serveLeft ? -1 : 1) * speed * Math.cos(angle);
        this.vy = speed * Math.sin(angle);
        ballTrail = [];
        state.rally = 0;
      },
    };

    const p1 = {
      w: SETTINGS.paddle.width,
      h: SETTINGS.paddle.height,
      dy: 0,
      x: SETTINGS.paddle.margin,
      y: canvas.height / 2 - SETTINGS.paddle.height / 2,
      color: getComputedStyle(document.documentElement).getPropertyValue('--paddle-p1-color').trim()
    };

    const p2 = {
      w: SETTINGS.paddle.width,
      h: SETTINGS.paddle.height,
      dy: 0,
      x: canvas.width - SETTINGS.paddle.margin - SETTINGS.paddle.width,
      y: canvas.height / 2 - SETTINGS.paddle.height / 2,
      color: getComputedStyle(document.documentElement).getPropertyValue('--paddle-p2-color').trim()
    };

    const keys = {};

    document.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === ' ') {
        e.preventDefault();
        if (state.gameOver) resetGame();
        else if (!state.running) startGame();
        else togglePause();
      }
    });

    document.addEventListener('keyup', e => { keys[e.key] = false; });

    function clamp(val, min, max) {
      return Math.max(min, Math.min(max, val));
    }

    function createParticles(x, y, color, direction) {
      for (let i = 0; i < 15; i++) {
        particles.push({
          x: x,
          y: y,
          vx: direction * (Math.random() * 4 + 2),
          vy: (Math.random() - 0.5) * 6,
          life: 1,
          color: color
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function triggerShake() {
      state.screenShake = 10;
    }

    function movePaddles() {
      if (keys['w'] || keys['W']) p1.dy = -SETTINGS.paddle.speed;
      else if (keys['s'] || keys['S']) p1.dy = SETTINGS.paddle.speed;
      else p1.dy = 0;

      if (keys['ArrowUp']) p2.dy = -SETTINGS.paddle.speed;
      else if (keys['ArrowDown']) p2.dy = SETTINGS.paddle.speed;
      else p2.dy = 0;

      p1.y = clamp(p1.y + p1.dy, 0, canvas.height - p1.h);
      p2.y = clamp(p2.y + p2.dy, 0, canvas.height - p2.h);
    }

    function moveBall() {
      ballTrail.push({ x: ball.x, y: ball.y });
      if (ballTrail.length > 8) ballTrail.shift();

      let nextX = ball.x + ball.vx;
      let nextY = ball.y + ball.vy;

      if (nextY - ball.r <= 0) {
        nextY = ball.r;
        ball.vy = Math.abs(ball.vy);
        triggerShake();
      } else if (nextY + ball.r >= canvas.height) {
        nextY = canvas.height - ball.r;
        ball.vy = -Math.abs(ball.vy);
        triggerShake();
      }

      if (ball.vx < 0 && ball.x - ball.r >= p1.x + p1.w && nextX - ball.r <= p1.x + p1.w) {
        let intersectY = ball.y - ((ball.x - (p1.x + p1.w)) * (ball.vy / ball.vx));
        if (intersectY >= p1.y - ball.r && intersectY <= p1.y + p1.h + ball.r) {
          nextX = p1.x + p1.w + ball.r;
          bounceBallOff(p1, 1);
          createParticles(nextX, intersectY, p1.color, 1);
          triggerShake();
        }
      }

      if (ball.vx > 0 && ball.x + ball.r <= p2.x && nextX + ball.r >= p2.x) {
        let intersectY = ball.y + ((p2.x - ball.x) * (ball.vy / ball.vx));
        if (intersectY >= p2.y - ball.r && intersectY <= p2.y + p2.h + ball.r) {
          nextX = p2.x - ball.r;
          bounceBallOff(p2, -1);
          createParticles(nextX, intersectY, p2.color, -1);
          triggerShake();
        }
      }

      ball.x = nextX;
      ball.y = nextY;

      if (ball.x + ball.r < 0) score('p2');
      else if (ball.x - ball.r > canvas.width) score('p1');
    }

    function bounceBallOff(paddle, dir) {
      state.rally++;
      const hitPos = (ball.y - (paddle.y + paddle.h / 2)) / (paddle.h / 2);
      const bounceAngle = hitPos * (Math.PI / 4); 

      const currentSpeed = Math.min(
        Math.hypot(ball.vx, ball.vy) + SETTINGS.ball.speedIncrease,
        SETTINGS.ball.maxSpeed
      );

      ball.vx = dir * currentSpeed * Math.cos(bounceAngle);
      ball.vy = currentSpeed * Math.sin(bounceAngle);
    }

    function score(player) {
      state.scores[player]++;
      triggerShake();
      
      if (state.scores[player] >= SETTINGS.winScore) {
        endGame(player);
      } else {
        ball.reset(player === 'p1');
        resetPaddles();
      }
    }

    function draw() {
      ctx.save();
      if (state.screenShake > 0) {
        const dx = (Math.random() - 0.5) * 10;
        const dy = (Math.random() - 0.5) * 10;
        ctx.translate(dx, dy);
        state.screenShake--;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Center net
      ctx.setLineDash([10, 14]);
      ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--net-color').trim();
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // --- UPGRADED TYPOGRAPHY & SCORES ---
      
      // Scores (Bigger, brighter, with glow)
      ctx.shadowColor = getComputedStyle(document.documentElement).getPropertyValue('--score-color').trim();
      ctx.shadowBlur = 10; // Gives it a neon glow
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--score-color').trim();
      ctx.font = 'bold 64px var(--ui-font)'; // Increased from 48px
      ctx.textAlign = 'center';
      ctx.fillText(state.scores.p1, canvas.width / 4, 75);
      ctx.fillText(state.scores.p2, canvas.width * 3 / 4, 75);
      ctx.shadowBlur = 0; // Reset shadow so it doesn't bleed

      // Player labels (Color-coded, opaque, and highly readable)
      ctx.font = 'bold 22px var(--ui-font)';
      
      ctx.fillStyle = p1.color; // Match Pink Paddle
      ctx.fillText('PLAYER 1', canvas.width / 4, 110);
      
      ctx.fillStyle = p2.color; // Match Yellow Paddle
      ctx.fillText('PLAYER 2', canvas.width * 3 / 4, 110);
      
      // Rally Counter 
      if (state.rally > 2) {
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ball-color').trim();
        ctx.font = 'bold 20px var(--ui-font)';
        ctx.fillText(`RALLY: ${state.rally}`, canvas.width / 2, 40);
      }
      
      // ------------------------------------

      // Paddles
      ctx.fillStyle = p1.color;
      ctx.beginPath();
      ctx.roundRect(p1.x, p1.y, p1.w, p1.h, 4);
      ctx.fill();

      ctx.fillStyle = p2.color;
      ctx.beginPath();
      ctx.roundRect(p2.x, p2.y, p2.w, p2.h, 4);
      ctx.fill();

      // Ball Trail
      for (let i = 0; i < ballTrail.length; i++) {
        const point = ballTrail[i];
        const alpha = (i + 1) / ballTrail.length;
        ctx.globalAlpha = alpha * 0.5;
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ball-color').trim();
        ctx.beginPath();
        ctx.arc(point.x, point.y, ball.r * alpha, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Ball
      ctx.shadowColor = getComputedStyle(document.documentElement).getPropertyValue('--ball-color').trim();
      ctx.shadowBlur = 15;
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ball-color').trim();
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Particles
      particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      // Pause overlay
      if (state.paused) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(-20, -20, canvas.width + 40, canvas.height + 40);
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--score-color').trim();
        ctx.font = 'bold 36px var(--ui-font)';
        ctx.fillText('SYSTEM PAUSED', canvas.width / 2, canvas.height / 2);
        ctx.font = '16px var(--ui-font)';
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ball-color').trim();
        ctx.fillText('Press SPACE to resume', canvas.width / 2, canvas.height / 2 + 40);
      }

      ctx.restore();
    }

    let animId = null;

    function loop() {
      if (!state.paused) {
        movePaddles();
        moveBall();
        updateParticles();
      }
      draw();
      animId = requestAnimationFrame(loop);
    }

    function startGame() {
      state.running = true;
      state.paused = false;
      state.gameOver = false;
      message.textContent = '';
      ball.reset(Math.random() < 0.5);
      loop();
    }

    function togglePause() {
      state.paused = !state.paused;
      message.textContent = state.paused ? '' : '';
    }

    function endGame(winner) {
      state.running = false;
      state.gameOver = true;
      cancelAnimationFrame(animId);
      draw();

      const label = winner === 'p1' ? 'PLAYER 1' : 'PLAYER 2';
      message.textContent = `🏆 ${label} TAKES THE MATCH! Press SPACE to restart.`;
    }

    function resetGame() {
      cancelAnimationFrame(animId);
      state.scores = { p1: 0, p2: 0 };
      state.gameOver = false;
      state.paused = false;
      state.rally = 0;
      particles = [];
      resetPaddles();
      ball.reset(true);
      message.textContent = '';
      startGame();
    }

    function resetPaddles() {
      p1.y = canvas.height / 2 - p1.h / 2;
      p2.y = canvas.height / 2 - p2.h / 2;
      p1.dy = 0;
      p2.dy = 0;
    }

    resetPaddles();
    ball.reset(true);
    draw();
  </script>
</body>
</html>
